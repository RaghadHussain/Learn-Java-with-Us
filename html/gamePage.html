<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDevChallenge Game</title>
    <link rel="stylesheet" href="/Projects/learn-java-project/CSS/gameStyle.css">
    <script defer src="/Projects/learn-java-project/JS/app.js"></script>
</head>

<body">
    <header>
        <p id="code-comment">//MULTIPLAYER QUIZ GAME</p>
        <h1 id="game-name">Web<span style="color: #58A6FF;">Dev</span>Challenge</h1>
    </header>
    <main>
        <section id="player-timer-section">
            <p id="player-turn"></p>
            <p id="timer"></p>
        </section>
        <section id="question-answer-section">
            <p id="question"></p>
            <div id="options-sction">
                <button class="opt" id="option1-btn"></button>
                <button class="opt" id="option2-btn"></button>
                <button class="opt" id="option3-btn"></button>
                <button class="opt" id="option4-btn"></button>
            </div>
        </section>
        <br>
        <section id="quit-results-buttons-section">
            <button id="quit-btn">Quit Game</button>
            <button id="results-btn" hidden>Show Results</button>
        </section>
    </main>
    </body>

</html>
